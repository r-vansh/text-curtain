<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Text Curtain</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23101011'/%3E%3Cg stroke='%23f7f7f8' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='M9 7v18M16 7v18M23 7v18' stroke-dasharray='2 3.5'/%3E%3C/g%3E%3C/svg%3E">
<meta name="description" content="An interactive text curtain: vertical text on hanging ropes or fabric. Push, pluck and grab the lines.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&family=Geist+Pixel&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="c"></canvas>
<aside id="panel" class="collapsed">
  <header id="panelHead">
    <strong>Text Curtain</strong>
    <span class="hactions">
      <button id="soundHead" class="hbtn sndbtn" type="button" data-tip="Unmute" aria-label="Unmute" aria-pressed="false">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2.5 6.2h2.2L8 3.6v8.8L4.7 9.8H2.5z"/>
          <g class="waves"><path d="M10.4 6a3 3 0 0 1 0 4"/><path d="M12.2 4.3a5.4 5.4 0 0 1 0 7.4"/></g>
          <g class="mute"><path d="M10.5 6.2l3 3.6M13.5 6.2l-3 3.6"/></g>
        </svg>
      </button>
      <button id="undoBtn" class="hbtn" type="button" data-tip="Undo" data-key="Ctrl+Z" aria-label="Undo" disabled>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 3.5 2.5 6.5l3 3"/><path d="M2.5 6.5H9a3.5 3.5 0 0 1 0 7H6"/></svg>
      </button>
      <button id="redoBtn" class="hbtn" type="button" data-tip="Redo" data-key="Ctrl+Shift+Z" aria-label="Redo" disabled>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.5 3.5l3 3-3 3"/><path d="M13.5 6.5H7a3.5 3.5 0 0 0 0 7h3"/></svg>
      </button>
      <button id="toggleHint" class="hbtn" type="button" data-tip="Hide panel" data-key="H" aria-label="Hide panel">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"/></svg>
      </button>
    </span>
  </header>
  <div class="body minibar" id="panelBody"></div>
</aside>
<button id="showTab" type="button" aria-label="Show panel">
  <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5"/></svg>
  <span>Show panel</span>
</button>
<button id="soundBtn" class="sndbtn" type="button" data-tip="Unmute" aria-label="Unmute" aria-pressed="false">
  <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M2.5 6.2h2.2L8 3.6v8.8L4.7 9.8H2.5z"/>
    <g class="waves"><path d="M10.4 6a3 3 0 0 1 0 4"/><path d="M12.2 4.3a5.4 5.4 0 0 1 0 7.4"/></g>
    <g class="mute"><path d="M10.5 6.2l3 3.6M13.5 6.2l-3 3.6"/></g>
  </svg>
</button>

<script src="script.js"></script>
</body>
</html>
